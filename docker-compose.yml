version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-error-api
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - .:/app/ml_codebase
    environment:
      PYTHONUNBUFFERED: 1
    networks:
      - ml-network

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-error-streamlit
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - .:/app/ml_codebase
    depends_on:
      - api
    environment:
      PYTHONUNBUFFERED: 1
      STREAMLIT_SERVER_HEADLESS: "true"
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge
